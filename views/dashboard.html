<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dasbor Aset - GPIB Betlehem Sungai Ambawang</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

  <!-- Navbar Navigation -->
  <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-md">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-church text-xl text-amber-400"></i>
        <h1 class="text-sm md:text-lg font-bold tracking-wide">
          Aset GPIB Betlehem BSA
        </h1>
      </div>
      <span class="text-[10px] bg-blue-800 px-2 py-1 rounded-full font-mono text-blue-200">
        v1.3
      </span>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="container mx-auto p-4 md:p-6 max-w-5xl space-y-6">

    <!-- Header Banner -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-xl md:text-2xl font-extrabold text-blue-950">
          GPIB BETLEHEM SUNGAI AMBAWANG
        </h2>
        <p class="text-sm text-gray-500 mt-1 flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-red-500"></i>
          S-BSA / P-Serv / B-BSA
        </p>
      </div>
      <div class="flex items-center gap-2 text-sm text-gray-600 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
        <i class="fa-solid fa-layer-group text-blue-600"></i>
        <span>Master Register Digital</span>
      </div>
    </header>

    <!-- Ringkasan Statistik Aset -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="p-3 bg-blue-50 text-blue-600 rounded-lg">
          <i class="fa-solid fa-boxes-stacked text-xl"></i>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-semibold">Total Inventaris</p>
          <p class="text-2xl font-bold text-gray-800 mt-0.5">0</p>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg">
          <i class="fa-solid fa-circle-check text-xl"></i>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-semibold">Kondisi Baik</p>
          <p class="text-2xl font-bold text-gray-800 mt-0.5">0</p>
        </div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-4">
        <div class="p-3 bg-amber-50 text-amber-600 rounded-lg">
          <i class="fa-solid fa-wrench text-xl"></i>
        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase font-semibold">Perlu Perbaikan</p>
          <p class="text-2xl font-bold text-gray-800 mt-0.5">0</p>
        </div>
      </div>
    </div>

    <!-- Form Entri Inventaris -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex items-center space-x-2 border-b border-gray-100 pb-4 mb-6">
        <i class="fa-solid fa-pen-to-square text-blue-900"></i>
        <h3 class="font-bold text-lg text-gray-800">Form Entri Inventaris</h3>
      </div>

      <form id="inventoryForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Barang / Aset</label>
            <input type="text" placeholder="Masukkan nama barang..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kode Barang</label>
            <input type="text" placeholder="Contoh: INV-BSA-001" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kategori / Ruangan</label>
            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-gray-700">
              <option value="">-- Pilih Ruangan --</option>
              <option value="S-BSA">S-BSA (Sungai Ambawang)</option>
              <option value="P-Serv">P-Serv (Pastori / Servant)</option>
              <option value="B-BSA">B-BSA (Bait / Gedung)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Kondisi Barang</label>
            <select class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm text-gray-700">
              <option value="Baik">Baik</option>
              <option value="Rusak Ringan">Rusak Ringan</option>
              <option value="Rusak Berat">Rusak Berat</option>
            </select>
          </div>
        </div>

        <div class="pt-2 flex justify-end">
          <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-plus"></i>
            Simpan Data
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-xs text-gray-400">
    &copy; GPIB Betlehem Sungai Ambawang - System Inventaris Aset
  </footer>

</body>
</html>
