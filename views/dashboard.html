<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Aset - GPIB Betlehem Sungai Ambawang</title>
    <!-- Jalur Desain & Ikon Online (Pastikan Laptop Terkoneksi Internet) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Pengaturan Aplikasi HP (PWA) -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navigasi Atas Atraktif -->
    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-church text-xl md:text-2xl text-amber-400 px-1"></i>
                <h1 class="text-sm md:text-lg font-bold tracking-wide">Aset GPIB Betlehem BSA</h1>
            </div>
            <span class="text-[10px] md:text-xs bg-blue-800 px-2.5 py-1 rounded-full font-mono text-blue-200">v1.0</span>
        </div>
    </nav>

    <!-- Konten Utama Aplikasi (Sangat Responsif di HP) -->
    <main class="container mx-auto p-4 space-y-6 max-w-4xl">
        
        <!-- Komponen Gambar Banner Dasbor yang Bisa Diganti -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div id="dashboard-banner" class="w-full h-440 md:h-600 bg-gradient-to-r from-blue-700 to-indigo-900 bg-cover bg-center flex items-end p-6 relative">
                <div class="absolute inset-0 bg-black bg-opacity-40"></div>
              <!-- Susunan Logo di Sebelah Kiri Tulisan Nama Gereja -->
<div class="relative z-10 text-white flex items-center space-x-3">
    <!-- Komponen Gambar Logo GPIB -->
    <img src="https://gpib.or.id" alt="Logo GPIB" class="w-12 h-12 md:w-16 md:h-16 object-contain drop-shadow-md bg-white/90 p-1 rounded-xl shrink-0">

    <!-- Komponen Teks Keterangan Gereja -->
    <div>
        <p class="text-[10px] md:text-xs uppercase tracking-wider font-bold text-amber-300">Sistem Informasi Manajemen Inventaris</p>
        <h2 class="text-sm md:text-xl font-black tracking-tight mt-0.5">GPIB BETLEHEM SUNGAI AMBAWANG</h2>
    </div>
</div>
                </div>
                <!-- Tombol Menyisipkan/Ganti Gambar Banner -->
                <label class="absolute top-4 right-4 bg-white/90 backdrop-blur text-gray-700 p-2 rounded-full shadow-md cursor-pointer text-xs font-semibold flex items-center space-x-1 z-20 hover:bg-white transition">
                    <i class="fa-solid fa-camera text-blue-900"></i>
                    <span class="hidden sm:inline">Ganti Gambar</span>
                    <input type="file" id="upload-banner-input" class="hidden" accept="image/*">
                </label>
            </div>
        </div>

        <!-- Ringkasan Angka Status Kondisi Barang -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-4 rounded-xl border border-gray-100 text-center shadow-sm flex flex-col justify-center">
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-wider">B - Baik</p>
                <p class="text-xl md:text-2xl font-black text-green-600 mt-1" id="count-baik">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-100 text-center shadow-sm flex flex-col justify-center">
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-wider">P - Servis</p>
                <p class="text-xl md:text-2xl font-black text-amber-500 mt-1" id="count-perbaikan">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl border border-gray-100 text-center shadow-sm flex flex-col justify-center">
                <p class="text-[10px] md:text-xs text-gray-400 font-bold uppercase tracking-wider">R - Rusak</p>
                <p class="text-xl md:text-2xl font-black text-red-600 mt-1" id="count-rusak">0</p>
            </div>
        </div>

        <!-- Formulir Input Inventaris Dari HP -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center space-x-2 mb-4 border-b pb-3">
                <i class="fa-solid fa-square-plus text-blue-900 text-lg"></i>
                <h3 class="font-bold text-gray-800 text-sm md:text-base">Form Entri Inventaris</h3>
            </div>
            
            <form id="asset-form" class="space-y-4 text-xs md:text-sm">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Nama Barang / Aset</label>
                    <input type="text" id="nama_barang" required placeholder="Contoh: Mic Wireless Ashley" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-900 focus:border-transparent bg-gray-50/50">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Kategori (Bab 1.1)</label>
                        <select id="kategori" class="w-full p-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="HTB">HTB - Harta Tidak Bergerak</option>
                            <option value="HBG">HBG - Harta Bergerak</option>
                            <option value="HKI">HKI - Harta Tak Berwujud</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Lokasi Pos/Pelkes (Bab 1.2)</label>
                        <select id="lokasi" class="w-full p-3 border border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="IND">IND - Induk</option>
                            <option value="DAP">DAP - Dango Anugerah Penapat</option>
                            <option value="MIS">MIS - Menara Iman Siak</option>
                            <option value="PND">PND - Penabur Durian</option>
                            <option value="TJP">TJP - Tuah Jubata Sei. Pelaik</option>
                            <option value="SHB">SHB - Sahabat Berinang</option>
                            <option value="IMB">IMB - Imanuel Bengkarek</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Ruangan/Tempat</label>
                        <select id="tempat" class="w-full p-3 border border-gray-200 rounded-xl bg-white text-xs focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="GRJ">GRJ - Gereja</option>
                            <option value="KST">KST - Konsistori</option>
                            <option value="PST">PST - Pastori</option>
                            <option value="GDL">GDL - Gedung Lain</option>
                            <option value="KNT">KNT - Kantor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Tahun Perolehan</label>
                        <input type="number" id="tahun" value="2026" class="w-full p-3 border border-gray-200 rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-blue-900">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Kondisi Fisik</label>
                        <select id="kondisi" class="w-full p-3 border border-gray-200 rounded-xl bg-white text-xs focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="Baik">Baik (B)</option>
                            <option value="Perlu Perbaikan">Servis (P)</option>
                            <option value="Rusak Berat">Rusak (R)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-sm mt-2">
                    <i class="fa-solid fa-floppy-disk text-base"></i>
                    <span>Simpan & Beri Kode BSA</span>
                </button>
            </form>
        </div>

        <!-- Tabel Register Master Realtime dari Database Cloud -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center space-x-2 mb-3">
                <i class="fa-solid fa-table-list text-blue-900"></i>
                <h3 class="font-bold text-gray-800 text-sm">Master Register Digital (Supabase)</h3>
            </div>
            <div id="asset-list" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <p class="text-xs text-gray-400 text-center py-6">Hubungkan ke database online...</p>
            </div>
        </div>
    </main>

    <!-- Menyambungkan ke Logika Pengiriman Data -->
    <script src="/js/main.js"></script>
</body>
</html>
