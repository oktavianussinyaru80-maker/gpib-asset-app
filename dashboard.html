<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Aset - GPIB Betlehem Sungai Ambawang</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-gray-50 font-sans min-h-screen text-gray-800">

    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-church text-xl text-amber-400"></i>
                <h1 class="text-sm md:text-lg font-bold tracking-wide">Aset GPIB Betlehem BSA</h1>
            </div>
            <span class="text-[10px] bg-blue-800 px-2 rounded-full font-mono text-blue-200">v1.2</span>
        </div>
    </nav>

    <main class="container mx-auto p-4 space-y-6 max-w-md">
        <!-- Banner Dasbor -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div id="dashboard-banner" class="w-full h-28 bg-gradient-to-r from-blue-400 to-indigo-900 bg-cover bg-center flex items-end p-6 relative">
                <div class="absolute inset-0 bg-black bg-opacity-40"></div>
                <div class="relative z-10 text-white">
                    <p class="text-[10px] uppercase tracking-wider font-semibold text-amber-300">Sistem Informasi Manajemen Inventaris</p>
                    <h2 class="text-sm md:text-xl font-black tracking-tight mt-1">GPIB BETLEHEM SUNGAI AMBAWANG</h2>
                </div>
            </div>
        </div>

        <!-- Ringkasan Angka Status -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-white p-3 rounded-xl border text-center shadow-sm">
                <p class="text-[10px] text-gray-400 font-bold uppercase">B - Baik</p>
                <p class="text-xl font-black text-green-600 mt-1" id="count-baik">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl border text-center shadow-sm">
                <p class="text-[10px] text-gray-400 font-bold uppercase">P - Servis</p>
                <p class="text-xl font-black text-amber-500 mt-1" id="count-perbaikan">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl border text-center shadow-sm">
                <p class="text-[10px] text-gray-400 font-bold uppercase">R - Rusak</p>
                <p class="text-xl font-black text-red-600 mt-1" id="count-rusak">0</p>
            </div>
        </div>

        <!-- Form Entri Data -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 mb-4 border-b pb-2 text-sm flex items-center"><i class="fa-solid fa-square-plus text-blue-900 mr-2"></i>Form Entri Inventaris</h3>
            <form id="asset-form" class="space-y-4 text-xs md:text-sm">
                <div>
                    <label class="block font-bold text-gray-600 mb-1">Nama Barang / Aset</label>
                    <input type="text" id="nama_barang" required placeholder="Contoh: Mic Wireless Ashley" class="w-full p-3 border rounded-xl bg-gray-50/50 focus:outline-none focus:ring-2 focus:ring-blue-900">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Kategori (Bab 1.1)</label>
                        <select id="kategori" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="HBG">HBG - Harta Bergerak</option>
                            <option value="HTB">HTB - Harta Tidak Bergerak</option>
                            <option value="HKI">HKI - Harta Tak Berwujud</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Lokasi Pos/Pelkes (Bab 1.2)</label>
                        <select id="lokasi" class="w-full p-3 border rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="IND">IND - Induk</option>
                            <option value="DAP">DAP - Dango Anugerah Penapat</option>
                            <option value="MIS">MIS - Menara Iman Siak</option>
                            <option value="PND">PND - Penabur Durian</option>
                            <option value="TJP">TJP - Tuah Jubata Sei. Pelaik</option>
                            <option value="SHB">SHB - Sahabat Berinang</option>
                            <option value="IMB">IMB - Imanuel Bengkarek</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Ruangan</label>
                        <select id="tempat" class="w-full p-3 border rounded-xl bg-white text-xs focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="GRJ">GRJ - Gereja</option>
                            <option value="KST">KST - Konsistori</option>
                            <option value="PST">PST - Pastori</option>
                            <option value="GDL">GDL - Gedung Lain</option>
                            <option value="KNT">KNT - Kantor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Tahun</label>
                        <input type="number" id="tahun" value="2026" class="w-full p-3 border rounded-xl text-center focus:outline-none focus:ring-2 focus:ring-blue-900">
                    </div>
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">Kondisi</label>
                        <select id="kondisi" class="w-full p-3 border rounded-xl bg-white text-xs focus:outline-none focus:ring-2 focus:ring-blue-900">
                            <option value="Baik">Baik (B)</option>
                            <option value="Perlu Perbaikan">Servis (P)</option>
                            <option value="Rusak Berat">Rusak (R)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Simpan & Beri Kode BSA</span>
                </button>
            </form>
        </div>

        <!-- Master Register Digital -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 mb-3 text-sm flex items-center"><i class="fa-solid fa-table-list text-blue-900 mr-2"></i>Master Register Digital</h3>
            <div id="asset-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <p class="text-xs text-gray-400 text-center py-6">Memuat data dari database cloud...</p>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
